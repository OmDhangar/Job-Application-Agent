version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
#  Job Acquisition OS — Infrastructure
#  Ollama runs on HOST (GPU access). All other services run in Docker.
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ─── PostgreSQL + pgvector ────────────────────────────────────────────────
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: jobos
      POSTGRES_USER: jobos
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobos"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis ────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
    volumes:
      - redisdata:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s

  # ─── RabbitMQ ─────────────────────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-jobos}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-changeme}
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"   # Management UI: http://localhost:15672
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ─── FastAPI ──────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://jobos:${DB_PASSWORD:-changeme}@db:5432/jobos
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-jobos}:${RABBITMQ_PASSWORD:-changeme}@rabbitmq/
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}
      OLLAMA_BASE_URL: http://host.docker.internal:11434   # Ollama on host GPU
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b-instruct}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-base-en-v1.5}
      EMBEDDING_DEVICE: ${EMBEDDING_DEVICE:-cpu}           # CPU inside Docker; GPU is on host
      SECRET_KEY: ${SECRET_KEY:-change-me}
    ports:
      - "8000:8000"
    depends_on:
      db:        { condition: service_healthy }
      redis:     { condition: service_healthy }
      rabbitmq:  { condition: service_healthy }

  # ─── Ingestion Worker ─────────────────────────────────────────────────────
  ingestion_worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    restart: unless-stopped
    command: python -m src.queues.workers.ingestion_worker
    environment:
      DATABASE_URL: postgresql+asyncpg://jobos:${DB_PASSWORD:-changeme}@db:5432/jobos
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-jobos}:${RABBITMQ_PASSWORD:-changeme}@rabbitmq/
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    depends_on:
      db:       { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    deploy:
      replicas: 2

  # ─── Embedding Worker ─────────────────────────────────────────────────────
  embedding_worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    restart: unless-stopped
    command: python -m src.queues.workers.embedding_worker
    environment:
      DATABASE_URL: postgresql+asyncpg://jobos:${DB_PASSWORD:-changeme}@db:5432/jobos
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-jobos}:${RABBITMQ_PASSWORD:-changeme}@rabbitmq/
      EMBEDDING_MODEL: BAAI/bge-base-en-v1.5
      EMBEDDING_DEVICE: cpu
    depends_on:
      db:       { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  # ─── Streamlit UI ─────────────────────────────────────────────────────────
  ui:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    restart: unless-stopped
    command: streamlit run src/ui/app.py --server.port=8501 --server.address=0.0.0.0
    environment:
      API_BASE: http://api:8000/api/v1
    ports:
      - "8501:8501"
    depends_on:
      - api

volumes:
  pgdata:
  redisdata:
  rabbitmqdata:
