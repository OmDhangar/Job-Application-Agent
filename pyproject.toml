[tool.poetry]
name = "job-acquisition-os"
version = "1.0.0"
description = "AI-powered Job Acquisition Operating System"
authors = ["Your Name <you@example.com>"]

[tool.poetry.dependencies]
python = "^3.11"

# API
fastapi = "^0.115"
uvicorn = {extras = ["standard"], version = "^0.29"}
pydantic = "^2.7"
pydantic-settings = "^2.2"

# Database
sqlalchemy = {extras = ["asyncio"], version = "^2.0"}
asyncpg = "^0.29"
alembic = "^1.13"
pgvector = "^0.3"

# Queues
aio-pika = "^9.4"           # RabbitMQ async client
redis = {extras = ["asyncio"], version = "^5.0"}

# AI — Cloud
google-genai = "^1.0"

# AI — Local
sentence-transformers = "^3.0"
httpx = "^0.27"             # Ollama REST client

# CrewAI
crewai = "^0.63"

# Scraping
playwright = "^1.44"
beautifulsoup4 = "^4.12"

# Resume parsing
pypdf2 = "^3.0"
python-docx = "^1.1"

# Scheduling
apscheduler = "^3.10"

# Utilities
python-dotenv = "^1.0"
structlog = "^24.1"
tenacity = "^8.3"           # retries
xxhash = "^3.4"             # fast hashing

# UI
streamlit = "^1.35"

[tool.poetry.dev-dependencies]
pytest = "^8.0"
pytest-asyncio = "^0.23"
httpx = "^0.27"
ruff = "^0.4"
mypy = "^1.10"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"
